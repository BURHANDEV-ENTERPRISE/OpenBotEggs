name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # follow new OpenBot releases
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: name   # image names must be lowercase
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openbot-pterodactyl" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.name.outputs.image }}:latest
